name: GitTeach CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: npm ci
      - run: npm run test:core
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  typesafe-canary:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: core
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - name: TypeSafe canary unavailable
        if: env.TYPESAFE_API_KEY == ''
        shell: bash
        run: echo "::notice::TYPESAFE_API_KEY is not configured; skipping optional live TypeSafe canary."
      - uses: actions/checkout@v4
        if: env.TYPESAFE_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.TYPESAFE_API_KEY != ''
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: env.TYPESAFE_API_KEY != ''
      - name: Run bounded TypeSafe canary
        if: env.TYPESAFE_API_KEY != ''
        run: node scripts/typesafe-canary.mjs
