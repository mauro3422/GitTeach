[package]
name = "giteach-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "giteach_desktop"
path = "src/lib.rs"

[[bin]]
name = "giteach-desktop"
path = "src/main.rs"

[dependencies]
giteach-core = { path = "../giteach-core" }
serde = { version = "1", features = ["derive"] }
tauri = "2"

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
